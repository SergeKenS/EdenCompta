name: edencompta_pos
description: "EdenCompta POS - Système de gestion pour petits commerces"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # État et architecture
  flutter_riverpod: ^2.4.5
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^12.1.1
  
  # HTTP et réseau
  dio: ^5.3.2
  
  # Stockage local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.0.2+1
  
  # UI
  material_color_utilities: ^0.11.1
  cupertino_icons: ^1.0.2
  
  # Internationalisation
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.6
  hive_generator: ^2.0.1
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Fonts (optionnel)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: fonts/Inter-Regular.ttf
  #       - asset: fonts/Inter-Bold.ttf
  #         weight: 700
