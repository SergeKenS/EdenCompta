name: comptab_pos
description: Application POS COMPTAB - Frontend Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # État global et gestion des données
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP et API
  dio: ^5.3.2
  retrofit: ^4.0.3
  json_annotation: ^4.9.0
  
  # Base de données locale
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Stockage local
  shared_preferences: ^2.2.2
  
  # Utilitaires
  uuid: ^4.2.1
  intl: ^0.18.1
  decimal: ^2.3.3
  
  # UI et composants
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Permissions et fonctionnalités
  permission_handler: ^11.0.1
  qr_code_scanner: ^1.0.1
  barcode_widget: ^2.0.4
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Tests
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.7

dev_dependencies:
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  retrofit_generator: ^7.0.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  # Polices - Commentées jusqu'à ce que les fichiers soient disponibles
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
